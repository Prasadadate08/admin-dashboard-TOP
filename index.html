<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="search">
                <label for="search"></label>
                <input type="search" id="search" name="search">
            </div>
            <div class="notification">
                <img src="Assets/bell-ring-outline.svg" alt="notification icon" height="20px">
            </div>
            <div class="user-logo">user-logo</div>
            <div class="user-name">Morgan Oakley</div>
            <div class="user-logo">user-logo</div>
            <div class="user-greeting">
                <p>Hi there,</p>
                <p>Morgan Oakley (@morgan)</p>
            </div>

            <div class="buttons">
                <button>New</button>
                <button>Upload</button>
                <button>Share</button>
            </div>
        </div>

        <div class="sidebar">
            <p>Dashboard</p>
            <ul>
                <li>Home</li>
                <li>Profile</li>
                <li>Messages</li>
                <li>History</li>
                <li>Tasks</li>
                <li>Communities</li>
                <li>Settings</li>
                <li>Support</li>
                <li>Privacy</li>
            </ul>
        </div>

        <div class="main-content" >

        </div>
    </div>
</body>
</html>
